name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare CI Environment & Secrets
        run: |
          # Create fallback local.properties if not present
          if [ ! -f local.properties ]; then
            echo "PLACES_API_KEY=${{ secrets.PLACES_API_KEY || 'MOCK_PLACES_API_KEY_FOR_CI' }}" >> local.properties
            echo "FOURSQUARE_API_KEY=${{ secrets.FOURSQUARE_API_KEY || 'MOCK_FOURSQUARE_API_KEY' }}" >> local.properties
          fi

          # Create dummy google-services.json for Google Services Gradle plugin compilation
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "nearbystorefinder-ci",
              "storage_bucket": "nearbystorefinder-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:mockappid",
                  "android_client_info": {
                    "package_name": "com.nan.nearbystorefinder"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock_api_key_for_ci"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nearo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
